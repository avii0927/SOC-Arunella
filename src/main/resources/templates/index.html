<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Arunella Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
    <div class="container">
        <a class="navbar-brand font-bold" th:href="@{/}">Arunella Admin</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/farmers}">Farmers</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/buyers}">Buyers</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/transporters}">Transporters</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/crops}">Crops</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/orders}">Orders</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/deliveries}">Deliveries</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <h2>Admin Dashboard Overview</h2>
    <hr class="mb-4">

    <div class="row g-3">
        <div class="col-md-4">
            <div class="card bg-success text-white">
                <div class="card-body">
                    <h5 class="card-title">Farmers</h5>
                    <p class="display-6" th:text="${farmerCount}">0</p>
                    <a th:href="@{/farmers}" class="btn btn-light btn-sm">View Farmers</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-warning text-dark">
                <div class="card-body">
                    <h5 class="card-title">Buyers</h5>
                    <p class="display-6" th:text="${buyerCount}">0</p>
                    <a th:href="@{/buyers}" class="btn btn-dark btn-sm">View Buyers</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-info text-white">
                <div class="card-body">
                    <h5 class="card-title">Transporters</h5>
                    <p class="display-6" th:text="${transporterCount}">0</p>
                    <a th:href="@{/transporters}" class="btn btn-light btn-sm">View Transporters</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-primary text-white">
                <div class="card-body">
                    <h5 class="card-title">Crops</h5>
                    <p class="display-6" th:text="${cropCount}">0</p>
                    <a th:href="@{/crops}" class="btn btn-light btn-sm">View Crops</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-dark text-white">
                <div class="card-body">
                    <h5 class="card-title">Orders</h5>
                    <p class="display-6" th:text="${orderCount}">0</p>
                    <a th:href="@{/orders}" class="btn btn-light btn-sm">View Orders</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-secondary text-white">
                <div class="card-body">
                    <h5 class="card-title">Deliveries</h5>
                    <p class="display-6" th:text="${deliveryCount}">0</p>
                    <a th:href="@{/deliveries}" class="btn btn-light btn-sm">View Deliveries</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
