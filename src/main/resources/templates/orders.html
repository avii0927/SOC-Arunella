<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Orders - Arunella Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
    <div class="container">
        <a class="navbar-brand font-bold" th:href="@{/}">Arunella Admin</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/farmers}">Farmers</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/buyers}">Buyers</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/transporters}">Transporters</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/crops}">Crops</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/orders}">Orders</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/deliveries}">Deliveries</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <h2>Orders List</h2>
    <hr class="mb-4">

    <div class="card">
        <div class="card-body">
            <table class="table table-bordered table-striped mb-0">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Quantity</th>
                        <th>Total Price (LKR)</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="o : ${orders}">
                        <td th:text="${o.orderId}">1</td>
                        <td th:text="${o.quantity}">Qty</td>
                        <td th:text="${o.price}">Price</td>
                        <td th:text="${o.date}">Date</td>
                        <td th:text="${o.status}">Status</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(orders)}">
                        <td colspan="5" class="text-center text-muted">No orders placed yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
