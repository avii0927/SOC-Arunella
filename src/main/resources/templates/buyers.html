<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Buyers - Arunella Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
    <div class="container">
        <a class="navbar-brand font-bold" th:href="@{/}">Arunella Admin</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/farmers}">Farmers</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/buyers}">Buyers</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/transporters}">Transporters</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/crops}">Crops</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/orders}">Orders</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/deliveries}">Deliveries</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <h2>Buyers List</h2>
    <hr class="mb-4">

    <div class="card">
        <div class="card-body">
            <table class="table table-bordered table-striped mb-0">
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Business Reg No</th>
                        <th>Market Location</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="buyer : ${buyers}">
                        <td th:text="${buyer.userId}">1</td>
                        <td th:text="${buyer.name}">Name</td>
                        <td th:text="${buyer.email}">Email</td>
                        <td th:text="${buyer.businessRegNo}">Reg No</td>
                        <td th:text="${buyer.marketLocation}">Location</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(buyers)}">
                        <td colspan="5" class="text-center text-muted">No buyers registered yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
