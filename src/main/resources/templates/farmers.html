<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Farmers - Arunella Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
    <div class="container">
        <a class="navbar-brand font-bold" th:href="@{/}">Arunella Admin</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/farmers}">Farmers</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/buyers}">Buyers</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/transporters}">Transporters</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/crops}">Crops</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/orders}">Orders</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/deliveries}">Deliveries</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <h2>Farmers List</h2>
    <hr class="mb-4">

    <div class="card">
        <div class="card-body">
            <table class="table table-bordered table-striped mb-0">
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>NIC</th>
                        <th>District</th>
                        <th>Contact No</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="farmer : ${farmers}">
                        <td th:text="${farmer.userId}">1</td>
                        <td th:text="${farmer.name}">Name</td>
                        <td th:text="${farmer.email}">Email</td>
                        <td th:text="${farmer.nic}">NIC</td>
                        <td th:text="${farmer.district}">District</td>
                        <td th:text="${farmer.contactNo}">Contact</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(farmers)}">
                        <td colspan="6" class="text-center text-muted">No farmers registered yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
